# Pinned so `docker compose` always targets the same project regardless of
# the folder it's checked out into (Compose defaults the project name to the
# current directory name, which drifted when this repo moved under
# vectorflow/backend and would otherwise spin up a second, empty stack).
name: vectorflow

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: vectorflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vectorflow
      POSTGRES_PASSWORD: vectorflow_dev_pw
      POSTGRES_DB: vectorflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: vectorflow_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7-alpine
    container_name: vectorflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: